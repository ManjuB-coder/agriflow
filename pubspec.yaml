name: agriflow_ai

description: AgriFlow AI - Smart Farming Assistant App

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:

  flutter:
    sdk: flutter

  # Cupertino Icons
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  # Image & Camera
  image_picker: ^1.1.2
  camera: ^0.11.0+1
  image: ^4.1.7
  file_picker: ^8.0.0+1

  # TensorFlow Lite
  tflite_flutter: ^0.11.0

  # State Management
  provider: ^6.1.2

  # API Calls
  http: ^1.2.1

  # Fonts
  google_fonts: ^6.2.1

  # Voice Features
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^0.68.0

  # Animations
  lottie: ^3.1.2

  # AI / ML Kit
  google_mlkit_image_labeling: ^0.13.0

  # Translation
  translator: ^1.0.3+1

  # Preferences
  shared_preferences: ^2.2.3

  # Internet Connectivity
  connectivity_plus: ^6.0.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  url_launcher: ^6.3.0

  
  

dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/models/
    - assets/crops/
    - assets/schemes/